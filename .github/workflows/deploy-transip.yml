name: Website publiceren naar TransIP

# TransIP webhosting werkt met SFTP op poort 22, niet met FTPS.
# De inloggegevens staan in het controlepaneel onder
# Webhosting > je domein > Website > SFTP/SSH.
#
# Draait bij elke wijziging in de site, en daarnaast elk uur. Dat uurlijkse
# ritme is nodig omdat de commits van de voortgang-workflow met de standaard
# GITHUB_TOKEN worden gedaan, en zulke commits starten bewust geen andere
# workflows. Zonder dit schema zou de teller op TransIP blijven hangen op de
# stand van de laatste handmatige wijziging.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "images/**"
      - "data/**"
      - ".github/workflows/deploy-transip.yml"
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy-transip
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicatiemap samenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js images data _site/
          echo "Te publiceren bestanden:"
          find _site -type f | sort

      - name: Benodigde gegevens controleren
        env:
          HOST: ${{ secrets.TRANSIP_FTP_HOST }}
          USER: ${{ secrets.TRANSIP_FTP_USER }}
          PASS: ${{ secrets.TRANSIP_FTP_PASSWORD }}
        run: |
          ontbreekt=""
          [ -z "$HOST" ] && ontbreekt="$ontbreekt TRANSIP_FTP_HOST"
          [ -z "$USER" ] && ontbreekt="$ontbreekt TRANSIP_FTP_USER"
          [ -z "$PASS" ] && ontbreekt="$ontbreekt TRANSIP_FTP_PASSWORD"
          if [ -n "$ontbreekt" ]; then
            echo "::error::Deze secrets ontbreken:$ontbreekt"
            exit 1
          fi
          echo "Alle drie de secrets zijn gevuld."

      - name: lftp en sshpass installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass

      - name: Serversleutel ophalen en bereikbaarheid controleren
        env:
          HOST: ${{ secrets.TRANSIP_FTP_HOST }}
        run: |
          if printf '%s' "$HOST" | grep -qE '://|:[0-9]+$|/'; then
            echo "::error::TRANSIP_FTP_HOST bevat een protocol, poort of pad. Vul alleen de hostnaam in, bijvoorbeeld iets.ssh.transip.me"
            exit 1
          fi
          # SSH loopt bij TransIP via een aparte toegangsserver, niet via het
          # website-adres. Je eigen domeinnaam invullen is de meest gemaakte fout.
          if ! printf '%s' "$HOST" | grep -qE '\.ssh\.transip\.(me|nl|eu)$'; then
            echo "::error::TRANSIP_FTP_HOST lijkt geen TransIP SSH-host. Verwacht wordt iets als xxxx.ssh.transip.me, te vinden onder Webhosting > je domein > Website > SFTP/SSH bij het veld Host. Je eigen domeinnaam werkt hier niet: die verwijst naar de webserver, niet naar de SSH-toegang."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if ! ssh-keyscan -T 15 -p 22 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::Kan geen SSH-verbinding openen met de opgegeven host. Controleer TRANSIP_FTP_HOST."
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::De host antwoordt niet op poort 22. Klopt de hostnaam uit het SFTP/SSH-scherm?"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          echo "Server bereikbaar, sleutel opgeslagen."

      - name: Verbinding testen en doelmap tonen
        env:
          HOST: ${{ secrets.TRANSIP_FTP_HOST }}
          GEBRUIKER: ${{ secrets.TRANSIP_FTP_USER }}
          SSHPASS: ${{ secrets.TRANSIP_FTP_PASSWORD }}
        run: |
          # sshpass -e leest het wachtwoord uit $SSHPASS, zodat het nergens in
          # een commandoregel of lftp-instelling terechtkomt die in het log komt.
          lftp -c "
            set sftp:connect-program 'sshpass -e ssh -a -x';
            set net:max-retries 1;
            set net:timeout 20;
            open sftp://$GEBRUIKER@$HOST;
            echo '--- huidige map ---';
            pwd;
            echo '--- inhoud ---';
            ls;
          " || {
            echo "::error::Inloggen mislukt. Controleer gebruikersnaam en wachtwoord uit Webhosting > je domein > Website > SFTP/SSH."
            exit 1
          }

      - name: Uploaden via SFTP
        env:
          HOST: ${{ secrets.TRANSIP_FTP_HOST }}
          GEBRUIKER: ${{ secrets.TRANSIP_FTP_USER }}
          SSHPASS: ${{ secrets.TRANSIP_FTP_PASSWORD }}
          MAP: ${{ vars.TRANSIP_DOCUMENTROOT || '/www' }}
        run: |
          lftp -c "
            set sftp:connect-program 'sshpass -e ssh -a -x';
            set net:max-retries 1;
            set net:timeout 20;
            open sftp://$GEBRUIKER@$HOST;
            mirror --reverse --verbose --parallel=2 \
                   --exclude-glob .git* \
                   _site '$MAP';
          "
          echo "Klaar. De site staat op TransIP in $MAP."

      - name: Controleren of de site online staat
        env:
          DOMEIN: ${{ vars.TRANSIP_DOMEIN || 'cornelooptvoordvnonderzoek.nl' }}
        run: |
          code=$(curl -s -o /tmp/pagina.html -w '%{http_code}' -L --max-time 20 "https://$DOMEIN" || echo "000")
          echo "HTTP $code van https://$DOMEIN"
          if grep -qi 'dunnevezelneuropathie' /tmp/pagina.html 2>/dev/null; then
            echo "De site is online en toont de juiste inhoud."
          elif grep -qi 'reserved domain' /tmp/pagina.html 2>/dev/null; then
            echo "::warning::De bestanden zijn geupload, maar het domein toont nog de parkeerpagina van TransIP. Koppel het hostingpakket aan het domein in het controlepaneel."
          else
            echo "::warning::De upload is gelukt, maar op $DOMEIN staat nog niet de verwachte inhoud. Controleer of de DocumentRoot klopt."
          fi
